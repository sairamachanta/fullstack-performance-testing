name: Performance & Load Testing Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday

jobs:
  performance-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          mkdir -p reports/k6 reports/lighthouse

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        run: k6 run k6/scenarios/load-test.js
        continue-on-error: true

      - name: Run k6 Stress Test
        run: k6 run k6/scenarios/stress-test.js
        continue-on-error: true

      - name: Run k6 Spike Test
        run: k6 run k6/scenarios/spike-test.js
        continue-on-error: true

      - name: Run k6 Soak Test
        run: k6 run k6/scenarios/soak-test.js
        continue-on-error: true

      - name: Run Lighthouse Audits
        run: |
          npx lighthouse https://reqres.in --quiet --chrome-flags="--headless --no-sandbox" --output html --output-path ./reports/lighthouse/homepage.report.html
          npx lighthouse https://reqres.in/#support-heading --quiet --chrome-flags="--headless --no-sandbox" --output html --output-path ./reports/lighthouse/forms.report.html
          npx lighthouse https://reqres.in/ --quiet --chrome-flags="--headless --no-sandbox" --output html --output-path ./reports/lighthouse/widgets.report.html
        continue-on-error: true

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
