name: Performance & Load Testing Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        run: k6 run k6/scenarios/load-test.js

      - name: Run k6 Stress Test
        run: k6 run k6/scenarios/stress-test.js
        continue-on-error: true # Stress tests might fail thresholds by design

      - name: Run Lighthouse Audits
        run: |
          npm run lighthouse:homepage
          npm run lighthouse:forms
          npm run lighthouse:widgets

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: reports/
